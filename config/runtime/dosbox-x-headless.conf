# This profile is only the checked-in headless startup/boot smoke baseline.
# A target-behavior Oracle must use a separate scenario that additionally pins
# its snapshot, input stream, checkpoint clock, and captured state surfaces.

[sdl]
fullscreen        = false
output            = surface
videodriver       = dummy
autolock          = false
autolock_feedback = none
waitonerror       = false
priority          = normal,normal
showmenu          = false

[dosbox]
machine                  = pc98
memsize                  = 16
fastbioslogo             = true
startbanner              = false
synchronize time         = false
working directory option = noprompt

[pc98]
pc-98 BIOS copyright string     = false
pc-98 fm board                  = board86c
pc-98 time stamp                = false
pc-98 sound bios                = false
pc-98 load sound bios rom file  = false
pc-98 enable 256-color          = false
pc-98 enable 16-color           = true
pc-98 enable grcg               = true
pc-98 enable egc                = true
pc-98 start gdc at 5mhz         = false
pc-98 timer always cycles       = true
pc-98 timer master frequency    = 5
pc-98 force ibm keyboard layout = false
pc-98 force JIS keyboard layout = false
pc-98 try font rom              = false

[cpu]
core    = normal
fpu     = true
cputype = auto
cycles  = fixed 8000
turbo   = false

[mixer]
nosound = true

[midi]
mpu401     = none
mididevice = none

[dos]
keyboardlayout = none

[autoexec]
