name: TH04 repository validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: th04-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Run public target-independent validation
        run: python3 scripts/ci.py
