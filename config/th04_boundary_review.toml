# Private inputs used to build config/th04_function_boundaries.csv.  The MAP
# files come from the pinned cold ReC98 candidate and therefore corroborate
# ownership; they do not replace target control-flow evidence.  Runtime bases
# are the linear addresses used by the corresponding Ghidra imports.

[[map_artifacts]]
artifact = "th04-main"
map = "obj/th04/main.map"
inventory = ".analysis/ghidra/boundary-exports/th04-main/functions.csv"
runtime_base = 0x10000
evidence_basis = "target-ghidra+candidate-map"

[[map_artifacts]]
artifact = "th04-op"
map = "obj/th04/op.map"
inventory = ".analysis/ghidra/boundary-exports/th04-op/functions.csv"
runtime_base = 0x10000
evidence_basis = "target-unpacked-ghidra+candidate-map"

[[map_artifacts]]
artifact = "th04-maine"
map = "obj/th04/maine.map"
inventory = ".analysis/ghidra/boundary-exports/th04-maine/functions.csv"
runtime_base = 0x10000
evidence_basis = "target-unpacked-ghidra+candidate-map"

# The monolithic assembly inputs below contain predominantly MASTER.LIB code in
# their _TEXT contributions.  Narrow game-owned exceptions are declared as
# exact-entry function overrides below.  Their other non-empty code
# contributions are target-derived game-code candidates and must not be
# mislabeled as original handwritten assembly.

[[module_overrides]]
artifact = "th04-main"
module = "th04_main.asm"
segment = "_TEXT"
origin = "library"
source_form = "master-library-aggregate"

[[module_overrides]]
artifact = "th04-op"
module = "th04_op.asm"
segment = "_TEXT"
origin = "library"
source_form = "master-library-aggregate"

[[module_overrides]]
artifact = "th04-maine"
module = "th04_maine_master.asm"
origin = "library"
source_form = "master-library-aggregate"

# th04_main.asm places this game-owned MPN renderer between MASTER.LIB
# includes.  The expanded TASM listing closes the FAR PROC at 0x3680..0x36f4,
# and the target Ghidra body independently agrees with that contiguous span.

[[function_overrides]]
artifact = "th04-main"
payload_offset = 0x3680
expected_body_span = 0x75
expected_tasm_proc = "sub_3680"
origin = "authored"
source_form = "target-derived-asm"
source_ref = "candidate:th04_main.asm"
notes = "Game-owned MPN renderer embedded between MASTER.LIB includes; TASM PROC and target Ghidra close the same 0x75-byte extent."

# Target-derived monolithic assembly candidates need TASM listings because
# local PROC symbols are not all exported by TLINK and are sometimes missed by
# Ghidra. listing_address_bias accounts only for an explicit COM `org 100h`.

[[assembly_boundary_sources]]
artifact = "th04-main"
source = "th04_main.asm"
module = "th04_main.asm"
map = "obj/th04/main.map"
default_segment = "_TEXT"

[[assembly_boundary_sources]]
