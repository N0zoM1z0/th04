schema_version = 1

gpt_web_root = ".analysis/gpt-web"

# These top-level analysis directories contain source snapshots still used by
# current replay commands. Keep them even if a future documentation edit stops
# mentioning them explicitly.
full_keep_dirs = [
  "v401-master-vs-object-replay-001",
  "v402-opmusic-hybrid-replay-001",
  "v489-bgimage-hybrid-replay-003",
]

# Human-reviewed historical replay trees whose expanded source copies are
# superseded by later retained snapshots. Their tracked command strings remain
# historical records; keep only receipt.json despite those old path mentions.
superseded_compact_dirs = [
  "v429-op-current-vs-target-001",
  "v429-maine-current-vs-target-001",
  "v466-zunsoft-full-cpp-replay-001",
  "v478-maine-staff-full-replay-001",
  "v487-maine-score-super-replay-001",
  "v488-op-score-group-replay-002",
]

# Focused cold-build/probe worktrees are rebuildable scratch output. Keep only
# directories that a checked-in script reads as an input rather than creates as
# an output.
probe_root = ".analysis/reconstruction/probes"
probe_keep_dirs = [
  "v546-zun-runtime-inventory-001",
]

# Explicit repository-local interpreter/build caches safe to remove. Keep this
# list narrow; never replace it with a generic recursive ignored-file delete.
cache_dirs = [
  "scripts/__pycache__",
  "scripts/probes/__pycache__",
  "scripts/lib/__pycache__",
  "scripts/boundary_review/__pycache__",
  "tests/__pycache__",
  ".pytest_cache",
  ".mypy_cache",
  "build",
  "dist",
  "out",
]

# Extra files required by current replay commands when a referenced experiment
# directory is compacted. `receipt.json` is always retained automatically.
[compact_keep_files]
"v436-tlink-uninitialized-replay-001" = [
  "controls/th04-op-RT.exe",
  "controls/th04-op-target-PR-on-I.exe",
  "controls/th04-maine-RT.exe",
  "controls/th04-maine-target-PR-on-I.exe",
]
"v492-bgm-bss-fileback-replay-002" = [
  "crossgame-restores/th05-op-smoke/OP.EXE",
  "crossgame-restores/th05-maine-smoke/MAINE.EXE",
]
