# are pinned topology observations from the cold ReC98 b6ba5b0a52 candidate.
# scripts/boundary_review/unpack_diet.py independently rejects them unless two
# executions of the hash-attested target, at distinct DOS load segments, produce the same
# unrelocated bytes and the expected target-observed transfer/relocation state.

